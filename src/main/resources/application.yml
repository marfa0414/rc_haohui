app:
  mode: ${APP_MODE:all}
  database:
    migration-mode: ${DATABASE_MIGRATION_MODE:validate}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 200
    accept-count: 100
    connection-timeout: 5s
    threads:
      max: 100
      min-spare: 10
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DATABASE_USERNAME:notification_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: 1
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 3
  jdbc:
    template:
      query-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: metrics

logging:
  level:
    org.apache.hc.client5.http.wire: 'OFF'
    org.apache.hc.client5.http.headers: 'OFF'
