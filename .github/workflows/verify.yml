name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: notifications_test
          POSTGRES_USER: notification_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notification_test -d notifications_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/notifications_test
      TEST_DATABASE_USER: notification_test
      TEST_DATABASE_PASSWORD: local-ci-test-only
      # Fixed fake credentials for the real environment-backed resolver in integration tests.
      CP04_TEST_SECRET: cp04-test-only-secret
      CP04_TEST_SECRET_VERSION: fixture-v1
      CP06_CLIENT_SECRET: 'cp06 fake:+密钥'
      CP06_CLIENT_SECRET_VERSION: fixture-oauth-v1
      CP06_ROTATED_SECRET: 'cp06 rotated secret'
      CP06_ROTATED_SECRET_VERSION: fixture-oauth-v2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.20'
          cache: maven
      - name: Build and run the complete current checkpoint suite
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Reject skipped or missing tests
        if: always()
        run: python3 scripts/verify_test_reports.py
      - name: Capture resolved dependencies
        run: ./mvnw --batch-mode --no-transfer-progress dependency:tree -DoutputFile=target/dependency-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-evidence
          path: |
            target/surefire-reports/
            target/evidence/
            target/dependency-tree.txt
          if-no-files-found: error
